name: conventional-commits

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  # This job name is the required status check declared in infra/github/index.ts.
  conventional-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Gitflow policy for PRs into main
        if: github.base_ref == 'main'
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          case "$HEAD_REF" in
            stg | hotfix/*) ;;
            *) echo "::error::PRs into main must come from stg or hotfix/*, not '$HEAD_REF'."; exit 1 ;;
          esac
          # The merge commit is a release marker; the changes inside it are already conventional commits.
          case "$PR_TITLE" in
            "chore(release): "*) ;;
            *) echo "::error::PRs into main are releases; title them 'chore(release): <summary>'."; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Lint PR title (it becomes the squash / merge commit subject)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint --verbose

      - name: Lint commits (merge commits carry them onto stg/main unchanged)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
